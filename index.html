<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic Videos Queue Master</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f0f2f5; }
        .log-container { max-height: 400px; overflow-y: auto; background-color: #0f172a; color: #38bdf8; font-family: 'Fira Code', monospace; font-size: 0.8rem; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-view { background: #10b981; color: white; padding: 2px 8px; border-radius: 4px; font-weight: 800; font-size: 10px; text-transform: uppercase; }
        .btn-view:hover { background: #059669; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const BASE_URL = 'http://localhost:8123';

        const LANGUAGES = [
            { code: 'en', label: 'English' },
            { code: 'fi', label: 'Finnish' },
            { code: 'th', label: 'Thai' },
        ];
        const LANG_LABEL = Object.fromEntries(LANGUAGES.map(l => [l.code, l.label]));

        function App() {
            const [linksText, setLinksText] = useState('');
            const [playlistName, setPlaylistName] = useState('spoil_movie');
            const [useVoxcpm, setUseVoxcpm] = useState(true);
            const [useAnime, setUseAnime] = useState(true);
            const [videoMethod, setVideoMethod] = useState(1);
            const [inputLang, setInputLang] = useState('en');
            const [outputLang, setOutputLang] = useState('th');
            const [videoSize, setVideoSize] = useState('tiktok');
            const [maxLength, setMaxLength] = useState(0);

            const [startTime, setStartTime] = useState('09:00');
            const [endTime, setEndTime] = useState('23:59');
            const [isEnabled, setIsEnabled] = useState(true);
            const [editingSettings, setEditingSettings] = useState(false);
            const [showSaved, setShowSaved] = useState(false);

            const [jobs, setJobs] = useState([]);
            const [status, setStatus] = useState({});
            const [expandedJobId, setExpandedJobId] = useState(null);
            const [jobLogs, setJobLogs] = useState([]);
            const [editingJob, setEditingJob] = useState(null);

            const pollInterval = useRef(null);
            const initialLoad = useRef(true);

            const fetchData = async () => {
                try {
                    const [jobsRes, statusRes] = await Promise.all([
                        fetch(`${BASE_URL}/jobs`),
                        fetch(`${BASE_URL}/status`)
                    ]);
                    const jobsData = await jobsRes.json();
                    const statusData = await statusRes.json();
                    setJobs(jobsData);
                    setStatus(statusData);
                    if (initialLoad.current && statusData.settings) {
                        setStartTime(statusData.settings.start_time);
                        setEndTime(statusData.settings.end_time);
                        setIsEnabled(statusData.settings.is_enabled);
                        initialLoad.current = false;
                    }
                } catch (e) { console.error(e); }
            };

            const fetchLogs = async (id) => {
                if (!id) return;
                try {
                    const res = await fetch(`${BASE_URL}/jobs/${id}/logs`);
                    setJobLogs(await res.json());
                } catch (e) { console.error(e); }
            };

            useEffect(() => {
                fetchData();
                pollInterval.current = setInterval(fetchData, 3000);
                return () => clearInterval(pollInterval.current);
            }, []);

            useEffect(() => {
                if (!expandedJobId) { setJobLogs([]); return; }
                fetchLogs(expandedJobId);
                const logInterval = setInterval(() => fetchLogs(expandedJobId), 2000);
                return () => clearInterval(logInterval);
            }, [expandedJobId]);

            const submitLinks = async (e) => {
                e.preventDefault();
                const urls = linksText.split('\n').filter(l => l.trim());
                await fetch(`${BASE_URL}/links`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_urls: urls, playlist_name: playlistName, use_voxcpm_tts: useVoxcpm, use_anime: useAnime, video_method: videoMethod, input_lang: inputLang, output_lang: outputLang, video_size: videoSize, max_length: maxLength })
                });
                setLinksText('');
                fetchData();
            };

            const runManual = async (id) => {
                const res = await fetch(`${BASE_URL}/jobs/${id}/run`, { method: 'POST' });
                if (!res.ok) { const err = await res.json(); alert(err.detail); }
                fetchData();
            };

            const deleteJob = async (id) => {
                if (!confirm('Delete this job?')) return;
                await fetch(`${BASE_URL}/jobs/${id}`, { method: 'DELETE' });
                fetchData();
            };

            const updateJob = async (id, data) => {
                await fetch(`${BASE_URL}/jobs/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                setEditingJob(null);
                fetchData();
            };

            const interruptJob = async (id) => {
                if (!confirm('Interrupt this job?')) return;
                await fetch(`${BASE_URL}/jobs/${id}/interrupt`, { method: 'POST' });
                fetchData();
            };

            const openFolder = async (path) => { await fetch(`${BASE_URL}/open-folder?path=${encodeURIComponent(path)}`); };
            const openFile = async (path) => { await fetch(`${BASE_URL}/open-file?path=${encodeURIComponent(path)}`); };

            const saveSettings = async () => {
                await fetch(`${BASE_URL}/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start_time: startTime, end_time: endTime, is_enabled: isEnabled })
                });
                setShowSaved(true);
                setEditingSettings(false);
                setTimeout(() => setShowSaved(false), 2000);
                fetchData();
            };

            const cancelSettings = () => {
                // restore from server
                if (status.settings) {
                    setStartTime(status.settings.start_time);
                    setEndTime(status.settings.end_time);
                    setIsEnabled(status.settings.is_enabled);
                }
                setEditingSettings(false);
            };

            return (
                <div className="container mx-auto p-6 max-w-[1400px]">
                    {/* ── Header ── */}
                    <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-4xl font-extrabold text-slate-900">Mimic Videos <span className="text-blue-600">Queue Master</span></h1>
                            <p className="text-slate-500 mt-1">Automated Video Production Pipeline</p>
                        </div>

                        {/* Working Period card — click to edit */}
                        {editingSettings ? (
                            <div className="bg-white p-4 rounded-xl shadow-md border border-blue-300 flex flex-col gap-3 min-w-[280px]">
                                <div className="text-[10px] font-black text-slate-400 uppercase tracking-wider mb-1">Working Period</div>
                                <div className="flex gap-2">
                                    <div className="flex-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase">Start</label>
                                        <input type="text" value={startTime} onChange={e => setStartTime(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-400 outline-none" />
                                    </div>
                                    <div className="flex-1">
                                        <label className="text-[10px] font-black text-slate-400 uppercase">End</label>
                                        <input type="text" value={endTime} onChange={e => setEndTime(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-lg text-sm font-mono focus:ring-2 focus:ring-blue-400 outline-none" />
                                    </div>
                                </div>
                                <div className="flex items-center justify-between">
                                    <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                                        <input type="checkbox" checked={isEnabled} onChange={e => setIsEnabled(e.target.checked)} className="w-4 h-4" />
                                        Enabled
                                    </label>
                                    <div className="flex gap-2">
                                        <button onClick={cancelSettings} className="px-3 py-1.5 rounded-lg text-xs font-bold border border-slate-200 text-slate-500 hover:bg-slate-50">Cancel</button>
                                        <button onClick={saveSettings} className="px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white hover:bg-blue-700">Save</button>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <button onClick={() => setEditingSettings(true)} className="flex items-center gap-4 bg-white p-4 rounded-xl shadow-sm border border-slate-200 hover:border-blue-300 hover:shadow-md transition-all text-left">
                                <div className="text-right">
                                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">Working Period</div>
                                    <div className="text-sm font-semibold text-slate-700">{status.settings?.start_time} – {status.settings?.end_time}</div>
                                    {showSaved && <div className="text-[10px] text-green-500 font-bold">Saved ✅</div>}
                                </div>
                                <div className={`w-3 h-3 rounded-full animate-pulse ${status.is_working_now ? 'bg-green-500' : 'bg-amber-500'}`}></div>
                                <div className="text-sm font-bold uppercase">{status.is_working_now ? 'Working' : 'Sleeping'}</div>
                                <div className="text-slate-300 text-lg">✏️</div>
                            </button>
                        )}
                    </header>

                    <div className="grid grid-cols-1 xl:grid-cols-12 gap-8">
                        {/* ── Add Queue (left panel) ── */}
                        <div className="xl:col-span-4">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h2 className="text-lg font-bold text-slate-800 mb-4">Add Queue</h2>
                                <form onSubmit={submitLinks}>
                                    {/* 2-column layout: URLs left, options right */}
                                    <div className="grid grid-cols-2 gap-4">
                                        {/* Left: URLs */}
                                        <div className="flex flex-col">
                                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">URLs</label>
                                            <textarea
                                                value={linksText}
                                                onChange={e => setLinksText(e.target.value)}
                                                className="flex-1 min-h-[220px] p-3 bg-slate-50 border rounded-xl text-xs font-mono resize-none focus:ring-2 focus:ring-blue-500 outline-none"
                                                placeholder={"https://tiktok.com/...\nhttps://tiktok.com/..."}
                                                required
                                            />
                                        </div>

                                        {/* Right: options */}
                                        <div className="flex flex-col gap-3">
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Playlist</label>
                                                <input type="text" value={playlistName} onChange={e => setPlaylistName(e.target.value)} className="w-full p-2 bg-slate-50 border rounded-lg text-sm font-semibold mt-0.5 focus:ring-2 focus:ring-blue-500 outline-none" />
                                            </div>
                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Max Length (sec)</label>
                                                <div className="flex items-center gap-2 mt-0.5">
                                                    <input type="number" min="0" value={maxLength || ''} onChange={e => setMaxLength(parseInt(e.target.value) || 0)} placeholder="0 = unlimited" className="flex-1 p-2 bg-slate-50 border rounded-lg text-sm font-mono focus:ring-2 focus:ring-orange-400 outline-none" />
                                                    {maxLength > 0 && <span className="text-[10px] font-black text-orange-500 uppercase whitespace-nowrap">{maxLength}s</span>}
                                                </div>
                                            </div>

                                            <div className="flex flex-col gap-1.5">
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest">Options</label>
                                                {videoMethod !== 4 && (
                                                    <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                                                        <input type="checkbox" checked={useVoxcpm} onChange={e => setUseVoxcpm(e.target.checked)} /> VoxCPM
                                                    </label>
                                                )}
                                                <label className="flex items-center gap-2 text-xs font-bold cursor-pointer">
                                                    <input type="checkbox" checked={useAnime} onChange={e => setUseAnime(e.target.checked)} /> Anime
                                                </label>
                                                {videoMethod === 4 && (
                                                    <div className="flex flex-col gap-1 mt-1 p-2 bg-amber-50 border border-amber-200 rounded-lg">
                                                        <div className="text-[10px] font-black text-amber-600 uppercase tracking-widest mb-0.5">M4 Options</div>
                                                        <div>
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase">Input (video lang)</div>
                                                            <select value={inputLang} onChange={e => setInputLang(e.target.value)} className="w-full p-1 bg-white border border-amber-200 rounded text-xs font-semibold mt-0.5 outline-none focus:ring-1 focus:ring-amber-400">
                                                                {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase">Output (subtitle lang)</div>
                                                            <select value={outputLang} onChange={e => setOutputLang(e.target.value)} className="w-full p-1 bg-white border border-amber-200 rounded text-xs font-semibold mt-0.5 outline-none focus:ring-1 focus:ring-amber-400">
                                                                {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.label}</option>)}
                                                            </select>
                                                        </div>
                                                        <div>
                                                            <div className="text-[10px] text-slate-400 font-bold uppercase">Output Size</div>
                                                            <div className="flex gap-1 mt-0.5">
                                                                <button type="button" onClick={() => setVideoSize('tiktok')} className={`flex-1 py-1 rounded text-[10px] font-black border transition-all ${videoSize === 'tiktok' ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-200 text-slate-500 hover:border-amber-300'}`}>
                                                                    TikTok<br/><span className="font-normal opacity-70">9:16</span>
                                                                </button>
                                                                <button type="button" onClick={() => setVideoSize('youtube')} className={`flex-1 py-1 rounded text-[10px] font-black border transition-all ${videoSize === 'youtube' ? 'bg-red-500 border-red-500 text-white' : 'border-slate-200 text-slate-500 hover:border-red-300'}`}>
                                                                    YouTube<br/><span className="font-normal opacity-70">16:9</span>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            <div>
                                                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Layout</label>
                                                <div className="flex gap-1">
                                                    <button type="button" onClick={() => setVideoMethod(1)} className={`flex-1 py-2 rounded-lg text-[10px] font-black border-2 transition-all ${videoMethod === 1 ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 text-slate-500 hover:border-blue-300'}`}>
                                                        M1<br/><span className="font-normal">Hdr+Sub</span>
                                                    </button>
                                                    <button type="button" onClick={() => setVideoMethod(2)} className={`flex-1 py-2 rounded-lg text-[10px] font-black border-2 transition-all ${videoMethod === 2 ? 'bg-violet-600 border-violet-600 text-white' : 'border-slate-200 text-slate-500 hover:border-violet-300'}`}>
                                                        M2<br/><span className="font-normal">↕ Split</span>
                                                    </button>
                                                    <button type="button" onClick={() => setVideoMethod(3)} className={`flex-1 py-2 rounded-lg text-[10px] font-black border-2 transition-all ${videoMethod === 3 ? 'bg-emerald-600 border-emerald-600 text-white' : 'border-slate-200 text-slate-500 hover:border-emerald-300'}`}>
                                                        M3<br/><span className="font-normal">↔ Split</span>
                                                    </button>
                                                    <button type="button" onClick={() => setVideoMethod(4)} className={`flex-1 py-2 rounded-lg text-[10px] font-black border-2 transition-all ${videoMethod === 4 ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-200 text-slate-500 hover:border-amber-300'}`}>
                                                        M4<br/><span className="font-normal">Vocab</span>
                                                    </button>
                                                </div>
                                            </div>

                                            <button type="submit" className="mt-auto w-full bg-blue-600 text-white py-3 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all active:scale-95 text-sm">
                                                Add to Queue
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                        {/* ── Job Table (right panel) ── */}
                        <div className="xl:col-span-8">
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="overflow-x-auto">
                                    <table className="w-full border-collapse table-fixed">
                                        <thead className="bg-slate-50 text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                            <tr>
                                                <th className="px-4 py-3 text-left w-28">Status</th>
                                                <th className="px-4 py-3 text-left">Video URL</th>
                                                <th className="px-4 py-3 text-left w-28">Playlist</th>
                                                <th className="px-4 py-3 text-center w-16">VoxCPM</th>
                                                <th className="px-4 py-3 text-center w-16">Anime</th>
                                                <th className="px-4 py-3 text-center w-20">Method</th>
                                                <th className="px-4 py-3 text-right w-56">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {jobs.map(job => (
                                                <React.Fragment key={job.id}>
                                                    <tr className={`hover:bg-slate-50/80 transition-colors ${expandedJobId === job.id ? 'bg-blue-50/30' : ''}`}>
                                                        <td className="px-4 py-4 whitespace-nowrap">
                                                            <button onClick={() => setExpandedJobId(expandedJobId === job.id ? null : job.id)} className={`px-2 py-1 rounded-full text-[10px] font-black uppercase tracking-tight ${
                                                                job.status === 'completed' ? 'bg-green-100 text-green-700' :
                                                                job.status === 'failed' ? 'bg-red-100 text-red-700' :
                                                                job.status === 'processing' ? 'bg-blue-100 text-blue-700 animate-pulse' :
                                                                'bg-slate-100 text-slate-500'
                                                            }`}>
                                                                {job.status} {expandedJobId === job.id ? '▲' : '▼'}
                                                            </button>
                                                        </td>
                                                        <td className="px-4 py-4 min-w-[160px]">
                                                            <div className="text-xs font-medium text-slate-800 line-clamp-1" title={job.video_url}>{job.video_url}</div>
                                                        </td>
                                                        <td className="px-4 py-4">
                                                            {editingJob?.id === job.id ? (
                                                                <input type="text" value={editingJob.playlist_name} onChange={e => setEditingJob({...editingJob, playlist_name: e.target.value})} className="p-1 border text-xs rounded w-full" />
                                                            ) : (
                                                                <span className="text-xs font-semibold text-slate-600">{job.playlist_name}</span>
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-4 text-center">
                                                            {job.video_method === 4 ? (
                                                                editingJob?.id === job.id ? (
                                                                    <div className="flex flex-col gap-1 items-center">
                                                                        <select value={editingJob.input_lang || 'en'} onChange={e => setEditingJob({...editingJob, input_lang: e.target.value})} className="p-0.5 border rounded text-[10px] w-14">
                                                                            {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.label.slice(0,2).toUpperCase()}</option>)}
                                                                        </select>
                                                                        <select value={editingJob.output_lang || 'th'} onChange={e => setEditingJob({...editingJob, output_lang: e.target.value})} className="p-0.5 border rounded text-[10px] w-14">
                                                                            {LANGUAGES.map(l => <option key={l.code} value={l.code}>{l.label.slice(0,2).toUpperCase()}</option>)}
                                                                        </select>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-[10px] font-black text-amber-600 uppercase">{(job.input_lang||'en').toUpperCase()}→{(job.output_lang||'th').toUpperCase()}</span>
                                                                )
                                                            ) : (
                                                                editingJob?.id === job.id ? (
                                                                    <input type="checkbox" checked={editingJob.use_voxcpm_tts} onChange={e => setEditingJob({...editingJob, use_voxcpm_tts: e.target.checked})} />
                                                                ) : (
                                                                    <div className={`w-2 h-2 rounded-full mx-auto ${job.use_voxcpm_tts ? 'bg-blue-500' : 'bg-slate-200'}`}></div>
                                                                )
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-4 text-center">
                                                            {editingJob?.id === job.id ? (
                                                                <input type="checkbox" checked={editingJob.use_anime} onChange={e => setEditingJob({...editingJob, use_anime: e.target.checked})} />
                                                            ) : (
                                                                <div className={`w-2 h-2 rounded-full mx-auto ${job.use_anime ? 'bg-purple-500' : 'bg-slate-200'}`}></div>
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-4 text-center">
                                                            {editingJob?.id === job.id ? (
                                                                <div className="flex gap-1 justify-center">
                                                                    <button type="button" onClick={() => setEditingJob({...editingJob, video_method: 1})} className={`px-1.5 py-1 rounded text-[10px] font-black border ${(editingJob.video_method || 1) === 1 ? 'bg-blue-600 text-white border-blue-600' : 'border-slate-300 text-slate-400'}`}>M1</button>
                                                                    <button type="button" onClick={() => setEditingJob({...editingJob, video_method: 2})} className={`px-1.5 py-1 rounded text-[10px] font-black border ${editingJob.video_method === 2 ? 'bg-violet-600 text-white border-violet-600' : 'border-slate-300 text-slate-400'}`}>M2</button>
                                                                    <button type="button" onClick={() => setEditingJob({...editingJob, video_method: 3})} className={`px-1.5 py-1 rounded text-[10px] font-black border ${editingJob.video_method === 3 ? 'bg-emerald-600 text-white border-emerald-600' : 'border-slate-300 text-slate-400'}`}>M3</button>
                                                                    <button type="button" onClick={() => setEditingJob({...editingJob, video_method: 4})} className={`px-1.5 py-1 rounded text-[10px] font-black border ${editingJob.video_method === 4 ? 'bg-amber-500 text-white border-amber-500' : 'border-slate-300 text-slate-400'}`}>M4</button>
                                                                </div>
                                                            ) : (
                                                                <span className={`px-2 py-0.5 rounded-full text-[10px] font-black ${
                                                                    job.video_method === 2 ? 'bg-violet-100 text-violet-700' :
                                                                    job.video_method === 3 ? 'bg-emerald-100 text-emerald-700' :
                                                                    job.video_method === 4 ? 'bg-amber-100 text-amber-700' :
                                                                    'bg-blue-100 text-blue-700'
                                                                }`}>
                                                                    M{job.video_method || 1}
                                                                </span>
                                                            )}
                                                        </td>
                                                        <td className="px-4 py-4 text-right whitespace-nowrap space-x-2">
                                                            {job.status === 'processing' && (
                                                                <button onClick={() => interruptJob(job.id)} className="bg-red-500 text-white px-2 py-1 rounded font-black text-[10px] uppercase hover:bg-red-600">Interrupt</button>
                                                            )}
                                                            {job.status === 'completed' && job.video_url_path && (
                                                                <button onClick={() => setExpandedJobId(expandedJobId === job.id ? null : job.id)} className="btn-view">View</button>
                                                            )}
                                                            {job.status !== 'processing' && (
                                                                <button onClick={() => runManual(job.id)} className="text-orange-500 font-black text-[10px] uppercase hover:underline">Run</button>
                                                            )}
                                                            {job.status === 'queued' && (
                                                                editingJob?.id === job.id ? (
                                                                    <button onClick={() => updateJob(job.id, editingJob)} className="text-green-600 font-black text-[10px] uppercase">Save</button>
                                                                ) : (
                                                                    <button onClick={() => setEditingJob(job)} className="text-blue-600 font-black text-[10px] uppercase">Edit</button>
                                                                )
                                                            )}
                                                            {job.status !== 'processing' && (
                                                                <button onClick={() => deleteJob(job.id)} className="text-red-400 hover:text-red-600 font-black text-[10px] uppercase">Del</button>
                                                            )}
                                                        </td>
                                                    </tr>
                                                    {expandedJobId === job.id && (
                                                        <tr className="bg-slate-900">
                                                            <td colSpan="7" className="p-0 border-t border-slate-700">
                                                                <div className="p-6">
                                                                    {job.status === 'completed' && job.video_url_path && (
                                                                        <div className="mb-6 bg-slate-800 p-4 rounded-xl shadow-2xl border border-slate-700 flex flex-col md:flex-row justify-between items-center gap-4">
                                                                            <div className="text-xs font-mono text-slate-300 break-all select-all flex-1">
                                                                                <div className="text-[10px] text-green-500 font-black uppercase mb-1 flex items-center gap-2">
                                                                                    <span className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                                                                                    Output Ready
                                                                                </div>
                                                                                <span className="text-slate-500 mr-2 uppercase font-black tracking-tighter">Path:</span>
                                                                                {job.video_full_path || job.video_url_path}
                                                                            </div>
                                                                            <div className="flex gap-2">
                                                                                <button onClick={() => openFile(job.video_full_path || job.video_url_path)} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg text-sm font-bold transition-all shadow-lg active:scale-95 whitespace-nowrap">
                                                                                    ▶️ Open Video
                                                                                </button>
                                                                                <button onClick={() => openFolder(job.video_full_path || job.video_url_path)} className="bg-green-600 hover:bg-green-500 text-white px-6 py-3 rounded-lg text-sm font-bold transition-all shadow-lg active:scale-95 whitespace-nowrap">
                                                                                    📁 Open Folder
                                                                                </button>
                                                                            </div>
                                                                        </div>
                                                                    )}
                                                                    <div className="log-container p-4 rounded-xl border border-slate-800">
                                                                        <div className="flex justify-between mb-4 border-b border-slate-800 pb-2">
                                                                            <span className="text-xs font-black text-slate-500 uppercase tracking-widest">Execution Logs</span>
                                                                            <span className="text-xs text-slate-600 font-mono">ID: {job.id}</span>
                                                                        </div>
                                                                        {jobLogs.length === 0 ? (
                                                                            <div className="text-slate-700 italic text-xs">Waiting to start...</div>
                                                                        ) : (
                                                                            jobLogs.map((log, i) => (
                                                                                <div key={i} className="mb-1.5 flex gap-4 text-[11px]">
                                                                                    <span className="text-slate-600 shrink-0">[{log.timestamp.split('T')[1].slice(0,8)}]</span>
                                                                                    <span className="text-blue-100">{log.message}</span>
                                                                                </div>
                                                                            ))
                                                                        )}
                                                                        {job.status === 'processing' && <div className="text-blue-400 animate-pulse font-bold mt-2 text-xs">_ PROCESSING STEP...</div>}
                                                                        {job.error && <div className="mt-4 p-3 bg-red-900/30 border border-red-500/30 text-red-400 rounded text-xs font-bold">Error: {job.error}</div>}
                                                                    </div>
                                                                </div>
                                                            </td>
                                                        </tr>
                                                    )}
                                                </React.Fragment>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
